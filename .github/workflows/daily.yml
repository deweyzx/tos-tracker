# daily.yml — Phase 6: run the whole tracker automatically on GitHub's computers.
#
# Every day (and whenever you click "Run workflow" on GitHub), this:
#   1. Gets a fresh copy of the repo
#   2. Installs Python and the libraries
#   3. Runs the tests (stops if anything is broken)
#   4. Scrapes (in a hidden browser for JavaScript pages), detects changes, and writes AI summaries
#   5. Commits and pushes any new policy versions and change reports
#   6. After 50 quiet days, leaves an empty commit so GitHub doesn't pause it

name: Daily policy check

on:
  schedule:
    # Every day at 11:23 UTC (6:23 AM Eastern in winter). Cron format:
    # minute hour day-of-month month day-of-week. An odd minute avoids the
    # busy top of the hour, when GitHub delays scheduled jobs.
    - cron: "23 11 * * *"
  workflow_dispatch: # adds a "Run workflow" button to run it by hand

permissions:
  contents: write # lets the job push its commits back to the repo

concurrency:
  group: daily-policy-check # never run two copies at the same time
  cancel-in-progress: false

jobs:
  check-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      # A hidden Chrome for the pages that build their text with JavaScript
      # (marked "browser": true in sources.json: Meta and Reddit).
      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test"
          python test_detect_changes.py
          python test_scraper.py   # offline: the browser is faked
          python test_summarize.py
          python test_backfill.py  # offline: the archive is faked, nothing is downloaded

      - name: Scrape policies
        run: python scraper.py

      - name: Detect changes
        run: python detect_changes.py

      - name: Summarize changes with AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # from GitHub's secret storage
        run: python summarize.py

      - name: Save results to the repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policies
          if [ -d changes ]; then git add changes; fi  # changes/ only exists once something has changed
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi

      # GitHub pauses scheduled jobs in a public repo after 60 days with no commits.
      # Policies can stay quiet that long, so if the last commit is over 50 days old,
      # leave an empty "still running" commit to keep the daily check switched on.
      - name: Keep the daily check switched on
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $days days ago."
          if [ "$days" -ge 50 ]; then
            git commit --allow-empty -m "Keep the daily check running (no policy changes in $days days)"
            git push
          fi
